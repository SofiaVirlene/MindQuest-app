<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MindQuest - Perfil</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="header-top">
        <button class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <h1 class="logo-text">MindQuest</h1>
        <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
      </div>
      <div class="subject-tag"><span>#Engenharia de Software</span></div>
      <nav class="sub-nav">
        <a href="feed.html" class="sub-nav-btn"><i class="fa-solid fa-house"></i></a>
        <a href="lobby-quiz.html" class="sub-nav-btn"><i class="fa-solid fa-gamepad"></i></a>
        <button class="sub-nav-btn"><i class="fa-regular fa-calendar"></i></button>
        <button class="sub-nav-btn"><i class="fa-regular fa-bookmark"></i></button>
      </nav>
    </header>

    <main class="main-content">
      <section class="profile-header">
        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
        <h2 class="profile-username">@user123</h2>
        <span class="profile-role">Aluno</span>
      </section>

      <section class="user-card">
        <div>
          <h3 class="user-fullname">Sofia Pereira</h3>
          <span class="guild-name">Nome da Guilda</span>
        </div>
        <div class="user-card-badge"><i class="fa-solid fa-trophy"></i></div>
      </section>

      <section class="level-section">
        <span class="level-title">Level 1</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width: 45%;"></div>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="grid-column">
          <div class="dash-item"><div class="item-number">1</div><span class="item-text">Disciplina 1</span></div>
          <div class="dash-item"><div class="item-number">2</div><span class="item-text">Disciplina 2</span></div>
          <div class="dash-item"><div class="item-number">3</div><span class="item-text">Disciplina 3</span></div>
        </div>
        <div class="grid-column">
          <div class="dash-item"><div class="rank-badge">#2</div><div class="quiz-info"><span class="quiz-title">Quiz 1</span><span class="quiz-stats"><i class="fa-solid fa-trophy"></i> 35 <i class="fa-regular fa-clock"></i> 1:40</span></div></div>
          <div class="dash-item"><div class="rank-badge">#5</div><div class="quiz-info"><span class="quiz-title">Quiz 2</span><span class="quiz-stats"><i class="fa-solid fa-trophy"></i> 20 <i class="fa-regular fa-clock"></i> 1:55</span></div></div>
          <div class="dash-item"><div class="rank-badge">#10</div><div class="quiz-info"><span class="quiz-title">Quiz 3</span><span class="quiz-stats"><i class="fa-solid fa-trophy"></i> 95 <i class="fa-regular fa-clock"></i> 0:50</span></div></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="feed.html" class="nav-item"><i class="fa-regular fa-compass"></i><span>Explorar</span></a>
      <a href="#" class="nav-item"><i class="fa-solid fa-users"></i><span>Comunidade</span></a>
      <a href="#" class="nav-item"><i class="fa-regular fa-star"></i><span>Destaques</span></a>
      <a href="dashboard.html" class="nav-item active"><i class="fa-regular fa-user"></i><span>Perfil</span></a>
      <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i><span>Configurações</span></a>
    </nav>
  </div>

</body>
</html>
